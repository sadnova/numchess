<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Numchess">
  <defs>
    <linearGradient id="shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9eef7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafd"/>
      <stop offset="100%" stop-color="#edf1f9"/>
    </linearGradient>
    <linearGradient id="diag-line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d6eae"/>
      <stop offset="100%" stop-color="#c47d28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#152033" flood-opacity="0.14"/>
    </filter>
    <filter id="chip" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1a2840" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#shell)" filter="url(#shadow)"/>

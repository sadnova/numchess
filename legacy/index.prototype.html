function remove_duplicates(arr) {
    var obj = {};
    var ret_arr = [];
    for (var i = 0; i < arr.length; i++) {
        obj[arr[i]] = true;
    }
    for (var key in obj) {
        ret_arr.push(key);
    }
    return ret_arr;
}


function results(a,b){
    var restxt="";
	var vm,hm,lv;
    for(var i=0;i<6;i++){
	  var v,h;
	  var num=i+1;
	  if(a.hasOwnProperty(num)){
	     h=a[num];
	  }
	  else{
	     h=0;
	  }
	  if(b.hasOwnProperty(num)){
	     v=b[num];
	  }
	  else{
	     v=0;
	  }
	  var tr="";
	  if(h>v){
	     tr="player 1 won";
	  }
	  else if(v>h){
	     tr="player 2 won";
	  }
	  else if(v==h){
	     tr="its a draw";
	  }
	  if(num>1){
	     if(v==h && h==0){}
		 else{
		  if(v!=h){
	      vm=v; hm=h; lv=num;
		  }
	     restxt+="Level "+num+" result, "+tr+" , "+h+" - "+v+" <br><br>";
		 }
	  }
	 
	}
	      if(lv==5){

	  }
	return restxt;
}
